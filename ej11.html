<button onclick="kilometro()">calcular</button>
<script>
    function kilometro(){
        let kil=prompt("Ingrese kilometros recorrido: ");
        kil=Number(kil);
        let litro=prompt("Ingrese litros de combustible consumidos: ");
        litro=Number(litro);
        let res=(litro/kil);
        alert("El consumo de combustible por kilometro es: "+ res);
    }
</script>
