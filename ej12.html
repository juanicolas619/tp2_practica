    <button onclick="paroimpar()">Consultar</button>
    <script>
        function paroimpar(){
            let num=prompt("Ingrese numero: ");
            num=Number(num);
            if (num % 2===0){
                alert("Es un numero PAR - "+ num);
            }
            else{
                alert("Es un numero IMPAR - "+ num);
            }
        }
    </script>
