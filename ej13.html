<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>Ejercicio 13</header>
    <nav>
        <li><a href="index.html">pagina de inicio</a></li>  
    </nav>
    <button onclick="arreglo()">Crear</button>
    <script>
        function arreglo(){
            let numero=[];
            for(i=0;i<4;i++){ // esto es para 4 valores
                let num=prompt("Ingrese valores: ");
                num=Number(num);
                numero.push(num);
            }
            for(i=0;i<4;i++){
                alert("Los numeros del arreglo son: "+ numero[i]);
            }
        }
    </script>
</body>
</html>
