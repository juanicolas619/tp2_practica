    </nav>
    <button onclick="duplicar()">Crear</button>
    <script>
        function duplicar(){
            let numero=[];
            for(i=0;i<5;i++){
                let num=prompt("ingrese valores: ");
                num=(Number(num)*2);
                numero.push(num);
            }
            for(i=0;i<5;i++){
                alert("Los valores del arreglo duplicados son: "+ numero[i]);
            }
        }
    </script>
